# xdg-desktop-portal backend choice for MONOLITH (XDG_CURRENT_DESKTOP=monolith).
# Install as ~/.config/xdg-desktop-portal/monolith-portals.conf (or /usr/share/xdg-desktop-portal/).
# gtk: file chooser, app chooser, settings ... ; wlr: screenshots and screen casting (optional).
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
